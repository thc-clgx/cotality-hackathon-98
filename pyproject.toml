[project]
name = "python-project-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [

]

[dependency-groups]
dev = [
    "behave>=1.2.6",
    "magicmock>=0.3",
    "nose2>=0.15.1",
    "nox>=2025.5.1",
    "ruff>=0.11.12",
]


[project.scripts]
sample = "python_project_template.main:main"


[tool.hatch.metadata]
authors = [

]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_project_template"]

[tool.mypy]
exclude = [
    "tests",
    "data",
]
warn_return_any = true
warn_unused_configs = true